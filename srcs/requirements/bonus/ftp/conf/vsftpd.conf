# Enable encrypted FTP connections
ssl_enable=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES

# Use modern TLS
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO

# Certificate and private key
rsa_cert_file=/etc/ssl/private/vsftpd.crt
rsa_private_key_file=/etc/ssl/private/vsftpd.key

# Passive connection compatibility
require_ssl_reuse=NO

# Run in the foreground (Crucial for Docker PID 1)
listen=YES
listen_address=0.0.0.0

# Access Control
anonymous_enable=NO
local_enable=YES
write_enable=YES

# Jail the user to their home directory (which will be /var/www/html)
chroot_local_user=YES
allow_writeable_chroot=YES

# Passive Mode Configuration (To bypass Docker NAT)
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
