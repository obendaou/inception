server {

    resolver 127.0.0.11 valid=10s ipv6=off;


    # SSL/TLS Configuration
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name obendaou.42.fr;

    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Encryption Protocol Restrictions
    ssl_protocols TLSv1.2 TLSv1.3;

    # Root and Index
    root /var/www/wordpress;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

	location /cadvisor {
        set $cadvisor_upstream cadvisor:8080;
        proxy_pass http://$cadvisor_upstream;
        auth_basic "Inception Admin Tools";
        auth_basic_user_file /run/secrets/admin_tools_htpasswd;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static {
        set $static_upstream static:80;
        proxy_pass http://$static_upstream/;
    }

    location /adminer {
        auth_basic "Inception Admin Tools";
        auth_basic_user_file /run/secrets/admin_tools_htpasswd;
        set $adminer_upstream adminer:8080;
        proxy_pass http://$adminer_upstream/;
    }

    # PHP Handling (Pass to WordPress Container)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass wordpress:9000;
    }
}